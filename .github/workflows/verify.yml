name: Verify reproduction bundle

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install uv
      - name: Verify repository contents
        run: python verify_repository.py
      - name: Run quick offline reproduction
        run: python reproduce.py --quick --output-dir /tmp/baitbench-reproduction
      - name: Test task-generation code
        run: >-
          uv run --project make_datasets python -m unittest discover
          -s make_datasets/tests -p 'test_*.py'
